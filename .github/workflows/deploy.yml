name: Deploy Fullstack (Next.js + Laravel API) to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: https://api.videoreduce.com
        run: |
          npm run build
          # Ensure .htaccess is included in static export
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa

      - name: Deploy Frontend (Next.js) to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-65002}"
          FRONTEND_DIR="domains/videoreduce.com/public_html/"
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o TCPKeepAlive=yes"
          
          echo "Deploying Next.js frontend strictly to ${SSH_HOST}:${FRONTEND_DIR}..."
          
          # Only sync Next.js out folder to videoreduce domain, never delete, never touch root public_html or api
          rsync -avz \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'api/' \
            --exclude 'api' \
            -e "ssh -p ${PORT} ${SSH_OPTS}" \
            out/ "${SSH_USER}@${SSH_HOST}:${FRONTEND_DIR}"

          # Fix file permissions for videoreduce domain only
          echo "Setting web permissions on ${FRONTEND_DIR}..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "
            if [ -d '${FRONTEND_DIR}' ]; then
              find ${FRONTEND_DIR} -type d -exec chmod 755 {} + 2>/dev/null || true
              find ${FRONTEND_DIR} -type f -exec chmod 644 {} + 2>/dev/null || true
              if [ -f '${FRONTEND_DIR}.htaccess' ]; then
                chmod 644 '${FRONTEND_DIR}.htaccess'
              fi
            fi
          " || echo "Permissions command completed."
