name: Deploy Fullstack (Next.js + Laravel API) to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: https://api.videoreduce.com
        run: |
          npm run build
          # Ensure .htaccess is included in static export
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Frontend (Next.js) to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-65002}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o TCPKeepAlive=yes"
          
          echo "Preparing remote web directories..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" '
            mkdir -p public_html
            chmod 755 . || true
            chmod 755 public_html || true
          '

          echo "Deploying Next.js frontend to public_html/..."
          rsync -avz --delete \
            -e "ssh -p ${PORT} ${SSH_OPTS}" \
            out/ "${SSH_USER}@${SSH_HOST}:public_html/"

          # Check if domains/videoreduce.com/public_html exists or was created as addon domain
          HAS_DOMAIN=$(ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" '
            if [ -d "domains/videoreduce.com" ]; then
              mkdir -p domains/videoreduce.com/public_html
              echo "YES"
            else
              echo "NO"
            fi
          ')

          if echo "${HAS_DOMAIN}" | grep -q "YES"; then
            echo "Also syncing Next.js frontend to domains/videoreduce.com/public_html/..."
            rsync -avz --delete \
              -e "ssh -p ${PORT} ${SSH_OPTS}" \
              out/ "${SSH_USER}@${SSH_HOST}:domains/videoreduce.com/public_html/"
          fi

          # Fix file permissions across all web roots to guarantee 755/644 (prevents 403 Forbidden)
          echo "Fixing web permissions..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" '
            chmod 755 . || true
            chmod 755 public_html || true
            find public_html -type d -exec chmod 755 {} + 2>/dev/null || true
            find public_html -type f -exec chmod 644 {} + 2>/dev/null || true
            [ -f public_html/.htaccess ] && chmod 644 public_html/.htaccess || true

            if [ -d "domains" ]; then
              chmod 755 domains || true
              [ -d "domains/videoreduce.com" ] && chmod 755 domains/videoreduce.com || true
              if [ -d "domains/videoreduce.com/public_html" ]; then
                chmod 755 domains/videoreduce.com/public_html || true
                find domains/videoreduce.com/public_html -type d -exec chmod 755 {} + 2>/dev/null || true
                find domains/videoreduce.com/public_html -type f -exec chmod 644 {} + 2>/dev/null || true
                [ -f domains/videoreduce.com/public_html/.htaccess ] && chmod 644 domains/videoreduce.com/public_html/.htaccess || true
              fi
            fi
          ' || echo "Note: Web permissions fix command exited with code $? (ignoring non-fatal status)"

      - name: Deploy Backend (Laravel API) to Hostinger Subdomain
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_API_TARGET: ${{ secrets.REMOTE_API_TARGET }}
        run: |
          PORT="${SSH_PORT:-65002}"
          API_TARGET_DIR="${REMOTE_API_TARGET:-domains/api.videoreduce.com/public_html/}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o TCPKeepAlive=yes"
          
          echo "Deploying Laravel API to ${SSH_HOST}:${API_TARGET_DIR}..."
          
          # 1. Rsync api folder while safely preserving server .env, vendor, and storage
          rsync -avz \
            --exclude 'vendor/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'database/*.sqlite' \
            --exclude 'storage/logs/*' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            -e "ssh -p ${PORT} ${SSH_OPTS}" \
            api/ "${SSH_USER}@${SSH_HOST}:${API_TARGET_DIR}"

          # 2. Run remote composer install and database migrations if available
          echo "Running remote post-deployment tasks on Hostinger..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" << 'EOF'
            TARGET_PATH="domains/api.videoreduce.com/public_html"
            if [ -d "$TARGET_PATH" ]; then
              cd "$TARGET_PATH"
              find . -type d -exec chmod 755 {} + 2>/dev/null || true
              find . -type f -exec chmod 644 {} + 2>/dev/null || true
              if command -v composer &> /dev/null; then
                echo "Installing backend dependencies..."
                composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
              fi
              if [ -f ".env" ] && command -v php &> /dev/null; then
                echo "Running migrations and caching routes..."
                php artisan migrate --force || true
                php artisan config:cache || true
                php artisan route:cache || true
              fi
            fi
          EOF
