name: Deploy Fullstack (Next.js + Laravel API) to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: https://api.videoreduce.com
        run: |
          npm run build
          # Ensure .htaccess is included in static export
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Frontend (Next.js) to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-65002}"
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o TCPKeepAlive=yes"
          FRONTEND_DIR="public_html/"
          
          echo "Deploying Next.js frontend to ${SSH_HOST}:${FRONTEND_DIR}..."
          
          rsync -avz \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'api/' \
            --exclude 'api' \
            -e "ssh -p ${PORT} ${SSH_OPTS}" \
            out/ "${SSH_USER}@${SSH_HOST}:${FRONTEND_DIR}"

          # Fix file permissions and ensure NO api directory exists in frontend public_html
          echo "Cleaning any misplaced api folder and fixing permissions on ${FRONTEND_DIR}..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "
            if [ -d 'public_html/api' ]; then
              rm -rf 'public_html/api'
            fi

            find ${FRONTEND_DIR} -type d -exec chmod 755 {} + 2>/dev/null || true
            find ${FRONTEND_DIR} -type f -exec chmod 644 {} + 2>/dev/null || true
            if [ -f '${FRONTEND_DIR}.htaccess' ]; then
              chmod 644 '${FRONTEND_DIR}.htaccess'
            fi
          " || echo "Note: Permissions command exited with status $?"

      - name: Deploy Backend (Laravel API) to Hostinger Subdomain
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-65002}"
          API_TARGET_DIR="domains/api.videoreduce.com/public_html/"
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o TCPKeepAlive=yes"
          
          echo "Deploying Laravel API to Subdomain ${SSH_HOST}:${API_TARGET_DIR}..."
          
          # 1. Rsync api folder ONLY to subdomain while safely preserving server .env, vendor, and storage
          rsync -avz \
            --exclude 'vendor/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'database/*.sqlite' \
            --exclude 'storage/logs/*' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            -e "ssh -p ${PORT} ${SSH_OPTS}" \
            api/ "${SSH_USER}@${SSH_HOST}:${API_TARGET_DIR}"

          # 2. Run remote composer install and database migrations if available
          echo "Running remote post-deployment tasks on Hostinger..."
          ssh -p ${PORT} ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" << 'EOF'
            TARGET_PATH="domains/api.videoreduce.com/public_html"
            if [ -d "$TARGET_PATH" ]; then
              cd "$TARGET_PATH"
              find . -type d -exec chmod 755 {} + 2>/dev/null || true
              find . -type f -exec chmod 644 {} + 2>/dev/null || true
              if command -v composer &> /dev/null; then
                echo "Installing backend dependencies..."
                composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
              fi
              if [ -f ".env" ] && command -v php &> /dev/null; then
                echo "Running migrations and caching routes..."
                php artisan migrate --force || true
                php artisan config:cache || true
                php artisan route:cache || true
              fi
            fi
          EOF
