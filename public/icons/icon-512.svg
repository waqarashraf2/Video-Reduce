<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Glowing outer aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)" opacity="0.18" filter="blur(30px)" />

  <!-- Shield Base -->
  <path d="M256 90 L390 140 C390 270 330 380 256 420 C182 380 122 270 122 140 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="12" />

  <!-- Play Symbol / Media Core -->
  <polygon points="230,200 320,256 230,312" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))" />

  <!-- Wasm Sparkle Accent -->
  <circle cx="370" cy="130" r="18" fill="#10b981" stroke="#080c14" stroke-width="4" />
</svg>
